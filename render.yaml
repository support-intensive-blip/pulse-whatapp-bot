# Render Blueprint — deploy the backend (backend/) as a Docker web service.
# The dashboard (frontend/) is deployed separately on Netlify and proxies /api/*
# to this service (see frontend/netlify.toml).
#
# WhatsApp goes through Gallabox (WhatsApp Business API). Every connected number
# has its own webhook: https://<service>.onrender.com/webhooks/gallabox/<botId>
# (shown in the dashboard → AI Bots → Integration). Numbers, credentials and
# webhook secrets are managed in the dashboard and stored encrypted with
# JWT_SECRET — never regenerate JWT_SECRET once numbers are connected.
#
# Apply: push this file, then in Render → "New +" → "Blueprint" → pick this repo.
# The GALLABOX_* vars below are optional: on first boot they seed the first
# number (the legacy URL https://<service>.onrender.com/webhooks/gallabox keeps
# working for it, routed by channel id).
services:
  - type: web
    name: pulse-whatapp-bot
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Only redeploy when backend files change (frontend edits deploy on Netlify).
    buildFilter:
      paths:
        - backend/**
    region: oregon
    # Without Chromium the container needs far less memory; Starter (512MB) is
    # likely enough now, but this stays on Standard until that's been verified.
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    # Render allows exactly one disk. It's mounted at /app/persist and holds
    # data/ (SQLite conversation history + local KB index) — docker-entrypoint.sh
    # symlinks /app/data into it so every conversation survives redeploys.
    disk:
      name: wwebjs-session
      mountPath: /app/persist
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: VECTOR_BACKEND
        value: local
      - key: OPENAI_MODEL_SMART
        value: gpt-4o
      - key: OPENAI_MODEL_FAST
        value: gpt-4o-mini
      # --- secrets: set these in the Render dashboard, they are not synced ---
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHBOARD_ADMIN_EMAIL
        sync: false
      - key: DASHBOARD_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GALLABOX_API_KEY
        sync: false
      - key: GALLABOX_API_SECRET
        sync: false
      - key: GALLABOX_CHANNEL_ID
        sync: false
      - key: GALLABOX_ACCOUNT_ID
        sync: false
      - key: GALLABOX_PHONE
        sync: false
      - key: GALLABOX_WEBHOOK_SECRET
        sync: false
      # Supabase = durable store; teams, bots, settings and chats survive every deploy.
      # SUPABASE_DB_URL (Session pooler URI) lets the server create its own tables on boot.
      # Without a persistent disk, also set SQLITE_ENABLED=false (Supabase-primary).
      - key: SUPABASE_ENABLED
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
