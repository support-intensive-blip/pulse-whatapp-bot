# Render Blueprint — deploy the WhatsApp AI Assistant as a Docker web service.
#
# whatsapp-web.js drives a headless Chromium, so this MUST run on the Docker
# runtime (the Dockerfile installs Chromium) — NOT Render's native Node/Go env.
#
# Apply: push this file, then in Render → "New +" → "Blueprint" → pick this repo.
# After the first deploy, open https://<service>.onrender.com and scan the QR
# (or use the pairing-code flow) from the dashboard's Connect page.
services:
  - type: web
    name: pulse-whatapp-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    # Chromium + Node + SQLite need real memory. Starter (512MB) will OOM once
    # WhatsApp Web loads — use Standard (2GB) or larger.
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    # Render allows exactly one disk. It's mounted at /app/persist and holds
    # BOTH the WhatsApp session AND data/ (SQLite conversation memory + local
    # KB index) as subfolders — docker-entrypoint.sh symlinks .wwebjs_auth and
    # data into it. Previously only the WhatsApp session was on the disk, so
    # conversation memory and the KB index were wiped on every redeploy/restart.
    disk:
      name: wwebjs-session
      mountPath: /app/persist
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      # Keep Chromium's heap modest so the container stays under the plan limit.
      - key: CHROMIUM_JS_HEAP_MB
        value: "512"
      # No WHATSAPP_WEB_VERSION_URL pin: the client now loads whatever WhatsApp
      # Web is actually serving live (see resolveWebVersionCache in
      # src/bot/whatsapp.js). Only add this var back — pointing at a snapshot
      # from github.com/wppconnect-team/wa-version/tree/main/html — if login
      # regresses after a WhatsApp Web release and an older pinned build is
      # confirmed to fix it.
      - key: VECTOR_BACKEND
        value: local
      - key: OPENAI_MODEL_SMART
        value: gpt-4o
      - key: OPENAI_MODEL_FAST
        value: gpt-4o-mini
      # --- secrets: set these in the Render dashboard, they are not synced ---
      - key: OPENAI_API_KEY
        sync: false
      - key: DASHBOARD_ADMIN_EMAIL
        sync: false
      - key: DASHBOARD_ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
